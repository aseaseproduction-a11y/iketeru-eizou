<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>イケてる映像に追加</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">IKETERU EIZOU</p>
      <h1>この映像を追加</h1>
      <p id="status" class="status" role="status">開いているページを確認しています…</p>
      <dl id="metadata" class="metadata" hidden>
        <div><dt>媒体</dt><dd id="platform"></dd></div>
        <div><dt>ページ</dt><dd id="title"></dd></div>
      </dl>
      <button id="add-button" type="button" disabled>追加画面を開く</button>
      <p class="note">URLとタイトルは事前入力されます。保存前に内容を確認してください。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
